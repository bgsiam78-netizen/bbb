<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>RAFI AVIATOR PRO</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@600;800&display=swap');

    :root {
      --primary: #00ffcc;
      --accent: #ff007f;
      --bg-dark: rgba(7, 10, 18, 0.97);
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      font-family: 'Orbitron', sans-serif; overflow: hidden; background: #000;
      -webkit-user-select: none; user-select: none;
    }

    /* ব্যাকগ্রাউন্ড গেম সাইট[span_1](start_span)[span_1](end_span) */
    #game-frame {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; border: none; z-index: 1;
    }

    /* লগইন স্ক্রিন */
    #login-screen {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 280px; background: var(--bg-dark); border: 2px solid var(--primary);
      border-radius: 18px; z-index: 10001; padding: 25px 20px; text-align: center;
      box-shadow: 0 0 25px rgba(0,255,204,0.4); backdrop-filter: blur(12px);
    }

    .login-title {
      color: #fff; font-size: 14px; margin-bottom: 18px; text-transform: uppercase;
      font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px var(--primary);
    }

    .pass-input {
      width: 100%; padding: 12px; margin-bottom: 18px; background: rgba(0,0,0,0.6);
      border: 1.5px solid var(--primary); color: #fff; text-align: center;
      border-radius: 10px; font-size: 15px; letter-spacing: 4px; outline: none;
    }

    .btn {
      width: 100%; padding: 12px; background: linear-gradient(135deg, #00ffcc, #0077ff); border: none;
      color: #000; border-radius: 10px; cursor: pointer; font-weight: 900;
      font-family: 'Orbitron'; font-size: 12px; text-transform: uppercase;
      box-shadow: 0 0 15px rgba(0,255,204,0.6); transition: 0.2s;
    }
    .btn:active { transform: scale(0.96); }

    /* মেইন হ্যাক প্যানেল (চার কোণায় নিয়ন ইফেক্ট) */
    #main-panel {
      display: none; position: fixed; top: 40px; right: 15px;
      width: 280px; background: var(--bg-dark);
      border: 2px solid transparent; 
      border-image: linear-gradient(45deg, #ff007f, #00ffcc, #7f00ff, #ff8c00) 1;
      border-radius: 16px;
      z-index: 10000; color: #fff; 
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.3), inset 0 0 15px rgba(255, 0, 127, 0.2);
      backdrop-filter: blur(15px); touch-action: none; overflow: hidden;
    }

    /* চার কোণায় এক্সট্রা নিয়ন গ্লো ডেকোরেশন */
    #main-panel::before, #main-panel::after {
      content: ''; position: absolute; width: 10px; height: 10px; border-color: #ff007f; border-style: solid; z-index: 5; pointer-events: none;
    }
    #main-panel::before { top: 3px; left: 3px; border-width: 2px 0 0 2px; }
    #main-panel::after { top: 3px; right: 3px; border-width: 2px 2px 0 0; }

    /* টপ বার (বাম পাশে বড় লোগো, কিউট ফন্টে নাম ও ডানপাশে হাইড বাটন) */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.08); cursor: grab;
    }
    .top-bar:active { cursor: grabbing; }

    .brand-section { display: flex; align-items: center; gap: 8px; }
    .brand-logo { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1.5px solid #00ffcc; box-shadow: 0 0 8px #00ffcc; }
    
    /* কিউট ও প্রিমিয়াম টাইপোগ্রাফি */
    .brand-title {
      font-family: 'Poppins', sans-serif;
      font-size: 11px; font-weight: 800; letter-spacing: 0.5px;
      background: linear-gradient(90deg, #00ffcc, #ff007f);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 8px rgba(0,255,204,0.3);
    }

    .hide-btn {
      background: rgba(255,0,127,0.25); border: 1px solid #ff007f; color: #fff;
      width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: bold; box-shadow: 0 0 8px rgba(255,0,127,0.5);
    }

    /* কন্টেন্ট বডি */
    .content-body { padding: 10px; }
    .tab-pane { display: none; flex-direction: column; gap: 8px; }
    .tab-pane.active { display: flex; }

    /* সিগন্যাল ডিসপ্লে এরিয়া */
    .signal-container {
      position: relative; height: 165px; background: rgba(0,0,0,0.65);
      border-radius: 12px; border: 1px solid rgba(0,255,204,0.3);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      overflow: hidden; box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
    }

    .bg-video {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 1; opacity: 0.45; filter: contrast(1.2);
    }

    .cashout-label { font-size: 8px; color: #ff007f; letter-spacing: 2px; font-weight: 800; z-index: 2; margin-bottom: 2px; text-shadow: 0 0 5px #ff007f; }
    .signal-value { font-size: 38px; font-weight: 900; color: #fff; text-shadow: 0 0 15px #00ffcc, 0 0 30px #00ffcc; z-index: 2; letter-spacing: 2px; }

    /* এনালাইসিস বাটন */
    .analysis-btn-wrapper {
      background: linear-gradient(135deg, rgba(0,255,204,0.25), rgba(255,0,127,0.25));
      border: 1.5px solid #00ffcc; border-radius: 10px; padding: 11px; text-align: center; cursor: pointer;
      box-shadow: 0 0 12px rgba(0,255,204,0.4); transition: 0.2s;
    }
    .analysis-btn-wrapper:active { transform: scale(0.98); }
    .analysis-text { font-size: 11px; font-weight: 900; letter-spacing: 1.5px; color: #fff; text-shadow: 0 0 8px #00ffcc; }

    .developer-credit { font-size: 7px; color: #888; text-align: center; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

    /* নিচের নেভিগেশন বার */
    .bottom-nav {
      display: flex; background: rgba(5, 7, 14, 0.98);
      border-top: 1px solid rgba(255,255,255,0.08); padding: 6px 8px;
      justify-content: space-around; align-items: center; margin-top: 4px; border-radius: 0 0 16px 16px;
    }
    .nav-item {
      background: none; border: none; color: #777; display: flex; flex-direction: column;
      align-items: center; gap: 2px; font-size: 7px; font-family: 'Orbitron';
      cursor: pointer; font-weight: 700; transition: 0.2s;
    }
    .nav-item.active { color: #00ffcc; text-shadow: 0 0 8px #00ffcc; }
    .nav-item svg { width: 14px; height: 14px; fill: currentColor; }

    /* মিনি ফ্লোটিং লোগো (হাইড করা অবস্থায় ভেসে থাকার জন্য) */
    #floating-fab {
      position: fixed; top: 90px; right: 15px; width: 44px; height: 44px;
      background: #000; border-radius: 50%; border: 2px solid #00ffcc;
      z-index: 10002; display: none; cursor: pointer; box-shadow: 0 0 15px #00ffcc;
      overflow: hidden; touch-action: none;
    }
    #floating-fab img { width: 100%; height: 100%; object-fit: cover; }

    /* হিস্ট্রি ও সেটিংস স্টাইল */
    .panel-title-text { font-size: 10px; font-weight: 900; color: #ff007f; margin-bottom: 6px; letter-spacing: 1px; text-shadow: 0 0 5px rgba(255,0,127,0.5); }
    .history-container { max-height: 120px; overflow-y: auto; }
    .history-row { display: flex; justify-content: space-between; padding: 5px 8px; background: rgba(255,255,255,0.03); border-radius: 6px; margin-bottom: 3px; font-size: 10px; color: #00ffcc; font-weight: 700; border-left: 2px solid #00ffcc; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 10px; }
  </style>
</head>
<body>

  <!-- ব্যাকগ্রাউন্ড গেম সাইট[span_2](start_span)[span_2](end_span) -->
  <iframe id="game-frame" src="http://www.kx8.bike/?r=lsz0372"></iframe>

  <!-- মিনি ফ্লোটিং লোগো -->
  <div id="floating-fab" onclick="showHack()" title="Open Hack">
    <img src="https://i.postimg.cc/Dyn6z252/IMG-20261116-201617-273.jpg" alt="Logo">
  </div>

  <!-- লগইন স্ক্রিন -->
  <div id="login-screen">
    <div class="login-title">RAFI AVIATOR PRO</div>
    <input type="password" id="passInput" class="pass-input" placeholder="••••" maxlength="15">
    <button class="btn" onclick="checkLogin()">LOGIN</button>
  </div>

  <!-- মেইন হ্যাক প্যানেল -->
  <div id="main-panel">
    <!-- টপ বার -->
    <div class="top-bar" id="dragHeader">
      <div class="brand-section">
        <img src="https://i.postimg.cc/Dyn6z252/IMG-20261116-201617-273.jpg" class="brand-logo" alt="Logo">
        <div class="brand-title">RAFI AVIATOR PRO</div>[span_3](start_span)[span_3](end_span)
      </div>
      <button class="hide-btn" onclick="hideHack()" title="Hide Hack">🗕</button>
    </div>

    <!-- কন্টেন্ট বডি -->
    <div class="content-body">
      
      <!-- TAB 1: HOME -->
      <div id="pane-home" class="tab-pane active">
        <div class="signal-container">
          <!-- নতুন ব্যাকগ্রাউন্ড ভিডিও -->
          <video id="hackVideo" class="bg-video" muted playsinline preload="auto">
            <source src="https://media.rapidfile.cc/v/DeZijX2Yb5" type="video/mp4">
          </video>
          <div class="cashout-label">CASHOUT</div>
          <div id="signal-display" class="signal-value">1.00x</div>
          <div class="cashout-label" style="margin-top: 2px;">CASHOUT</div>
        </div>

        <div class="analysis-btn-wrapper" id="analysisBtn" onclick="startAnalysis()">
          <div class="analysis-text" id="btnText">🛡️ ANALYSIS</div>
        </div>
        <div class="developer-credit">AI PREDICTION ACCURACY 99.8%</div>
      </div>

      <!-- TAB 2: HISTORY -->
      <div id="pane-history" class="tab-pane">
        <div class="panel-title-text">SIGNAL HISTORY (<span id="totalCount">0</span>)</div>
        <div class="history-container" id="historyList">
          <div style="text-align: center; color: #555; margin-top: 25px; font-size: 10px;">No signals generated yet</div>
        </div>
      </div>

      <!-- TAB 3: SETTINGS -->
      <div id="pane-settings" class="tab-pane">
        <div class="panel-title-text">SETTINGS</div>
        <div class="setting-row">
          <span>Hack Status</span>
          <input type="checkbox" id="hackToggle" checked style="accent-color: #00ffcc;">
        </div>
        <div class="setting-row">
          <span>Engine Version</span>
          <span style="color: #ff007f;">v6.6 Ultra Pro</span>
        </div>
      </div>

    </div>

    <!-- নিচের নেভিগেশন বার -->
    <div class="bottom-nav">
      <button class="nav-item active" id="nav-home" onclick="switchTab('home')">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        HOME
      </button>
      <button class="nav-item" id="nav-history" onclick="switchTab('history')">
        <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 7 7 7 7 0 0 1-7-7h-2a9 9 0 109-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
        HISTORY
      </button>
      <button class="nav-item" id="nav-settings" onclick="switchTab('settings')">
        <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        SETTINGS
      </button>
    </div>
  </div>

  <script>
    const CORRECT_PASS = "RAFI6T9";[span_4](start_span)[span_4](end_span)
    let signalHistory = [];
    let isAnalyzing = false;

    function checkLogin() {
      const pass = document.getElementById('passInput').value.trim();
      if (pass === CORRECT_PASS) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-panel').style.display = 'block';
      } else {
        alert("WRONG PASSWORD! USE: RAFI6T9");[span_5](start_span)[span_5](end_span)
      }
    }

    // ট্যাব পরিবর্তন লজিক
    function switchTab(tabID) {
      document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      if (tabID === 'home') {
        document.getElementById('pane-home').classList.add('active');
        document.getElementById('nav-home').classList.add('active');
      } else if (tabID === 'history') {
        document.getElementById('pane-history').classList.add('active');
        document.getElementById('nav-history').classList.add('active');
      } else if (tabID === 'settings') {
        document.getElementById('pane-settings').classList.add('active');
        document.getElementById('nav-settings').classList.add('active');
      }
    }

    // হাইড ও শো ফাংশন
    function hideHack() {
      document.getElementById('main-panel').style.display = 'none';
      document.getElementById('floating-fab').style.display = 'block';
    }

    function showHack() {
      document.getElementById('floating-fab').style.display = 'none';
      document.getElementById('main-panel').style.display = 'block';
    }

    // এনালাইসিস এবং ভিডিও হ্যান্ডলিং লজিক
    function startAnalysis() {
      const isHackActive = document.getElementById('hackToggle').checked;
      if (!isHackActive) {
        alert("Hack is currently disabled in settings!");
        return;
      }

      if (isAnalyzing) return;
      isAnalyzing = true;

      const btnText = document.getElementById('btnText');
      const signalDisplay = document.getElementById('signal-display');
      const video = document.getElementById('hackVideo');

      btnText.innerText = "ANALYZING...";
      signalDisplay.innerText = "---";

      // ভিডিও প্লে শুরু হবে একবারে গোড়া থেকে
      video.currentTime = 0;
      video.play().catch(e => console.log("Video play blocked:", e));

      setTimeout(() => {
        // র‍্যান্ডম সিগন্যাল জেনারেট
        const multiplier = (Math.random() * (9.5 - 1.30) + 1.30).toFixed(2) + "x";

        // সিগন্যাল আসার পর ব্যাকগ্রাউন্ড ভিডিও পজ হয়ে যাবে
        video.pause();

        signalDisplay.innerText = multiplier;
        btnText.innerText = "🛡️ ANALYSIS";
        isAnalyzing = false;

        // হিস্টরিতে যুক্ত করা
        signalHistory.unshift(multiplier);
        updateHistoryUI();

      }, 2400); // ২.৪ সেকেন্ড পর অ্যানিমেশন শেষে সিগন্যাল আসবে
    }

    function updateHistoryUI() {
      const container = document.getElementById('historyList');
      document.getElementById('totalCount').innerText = signalHistory.length;

      container.innerHTML = signalHistory.map((item, index) => `
        <div class="history-row">
          <span>SIGNAL #${signalHistory.length - index}</span>
          <b>${item}</b>
        </div>
      `).join('');
    }

    // --- হ্যাক প্যানেল ড্র্যাগ করার কোড (যেখানে খুশি ডানে-বামে নিয়ে যাওয়ার সুবিধা) ---
    const panel = document.getElementById('main-panel');
    const header = document.getElementById('dragHeader');
    let isDragging = false, startX, startY;

    header.addEventListener('touchstart', (e) => {
      isDragging = true;
      startX = e.touches[0].clientX - panel.offsetLeft;
      startY = e.touches[0].clientY - panel.offsetTop;
    });

    document.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      panel.style.left = (e.touches[0].clientX - startX) + 'px';
      panel.style.top = (e.touches[0].clientY - startY) + 'px';
      panel.style.right = 'auto';
    }, { passive: true });

    document.addEventListener('touchend', () => { isDragging = false; });

    header.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - panel.offsetLeft;
      startY = e.clientY - panel.offsetTop;
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      panel.style.left = (e.clientX - startX) + 'px';
      panel.style.top = (e.clientY - startY) + 'px';
      panel.style.right = 'auto';
    });

    document.addEventListener('mouseup', () => { isDragging = false; });

    // ভাসমান লোগো ড্র্যাগ করার কোড
    const fab = document.getElementById('floating-fab');
    let fabDragging = false, fabX, fabY;

    fab.addEventListener('touchstart', (e) => {
      fabDragging = true;
      fabX = e.touches[0].clientX - fab.offsetLeft;
      fabY = e.touches[0].clientY - fab.offsetTop;
    });
    document.addEventListener('touchmove', (e) => {
      if (!fabDragging) return;
      fab.style.left = (e.touches[0].clientX - fabX) + 'px';
      fab.style.top = (e.touches[0].clientY - fabY) + 'px';
      fab.style.right = 'auto';
    }, { passive: true });
    document.addEventListener('touchend', () => { fabDragging = false; });
  </script>
</body>
</html>
